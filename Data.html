<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bias Visualization - V3 (Stable Interactive)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 15px;
            cursor: pointer;
            margin-right: 5px;
            font-family: inherit;
            transition: 0.3s;
        }
        button:hover, button.active {
            background: #00bcd4;
            border-color: #00bcd4;
            color: #000;
        }
        
        .label {
            position: absolute;
            color: #ffffff; /* 1. 始终保持白色 */
            font-size: 14px;
            pointer-events: none;
            text-shadow: 0 0 4px black, 0 0 2px black;
            user-select: none;
            transform: translate(-50%, 30px); /* 向下偏移，不遮挡圆点 */
            white-space: nowrap;
            transition: opacity 0.3s, font-size 0.3s;
        }
        .prob-tag {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00bcd4;
            color: #00bcd4;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 11px;
            transform: translate(-50%, -50%); /* 连线中间的标签 */
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<div id="ui-layer">
    <h3 style="margin-top:0;">AI Bias Data Viz</h3>
    <button id="btn-sphere" class="active">Sphere Layout</button>
    <button id="btn-chaos">Cloud Layout</button>
    <div id="info-panel" style="margin-top: 15px; display:none;">
        <strong>Focus:</strong> <span id="selected-word" style="color:#00bcd4"></span><br>
        <strong>Connections:</strong> <span id="conn-count"></span>
    </div>
</div>

<div id="canvas-container"></div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // --- 数据准备 ---
    const rawData = [
        { ant: "industrial", cons: "complex", lift: 3.2, counts: [ {w:"complex", p:0.55}, {w:"simple", p:0.1}, {w:"modern", p:0.2} ] },
        { ant: "industrial", cons: "waste", lift: 4.1, counts: [ {w:"waste", p:0.65}, {w:"production", p:0.2} ] },
        { ant: "man", cons: "management", lift: 2.1, counts: [ {w:"management", p:0.45}, {w:"driving", p:0.2}, {w:"working", p:0.15} ] },
        { ant: "man", cons: "driving", lift: 1.8, counts: [ {w:"driving", p:0.5}, {w:"walking", p:0.2} ] },
        { ant: "woman", cons: "family", lift: 2.5, counts: [ {w:"family", p:0.55}, {w:"children", p:0.3}, {w:"cooking", p:0.1} ] },
        { ant: "woman", cons: "children", lift: 2.8, counts: [ {w:"children", p:0.6}, {w:"care", p:0.2} ] },
        { ant: "doctor", cons: "man", lift: 1.9, counts: [ {w:"man", p:0.7}, {w:"woman", p:0.2}, {w:"nurse", p:0.05} ] },
        { ant: "nurse", cons: "woman", lift: 3.5, counts: [ {w:"woman", p:0.8}, {w:"man", p:0.1}, {w:"hospital", p:0.1} ] },
        { ant: "programmer", cons: "smart", lift: 1.5, counts: [ {w:"smart", p:0.4}, {w:"glasses", p:0.3}, {w:"computer", p:0.2} ] },
        { ant: "CEO", cons: "rich", lift: 2.2, counts: [ {w:"rich", p:0.5}, {w:"powerful", p:0.3}, {w:"man", p:0.15} ] },
        { ant: "poor", cons: "lazy", lift: 1.2, counts: [ {w:"lazy", p:0.3}, {w:"hardworking", p:0.1}, {w:"sad", p:0.4} ] },
        { ant: "science", cons: "difficult", lift: 1.4, counts: [ {w:"difficult", p:0.5}, {w:"boring", p:0.2}, {w:"useful", p:0.2} ] },
        { ant: "art", cons: "beautiful", lift: 1.6, counts: [ {w:"beautiful", p:0.6}, {w:"expensive", p:0.2}, {w:"abstract", p:0.1} ] }
    ];

    const nodesMap = new Map();
    rawData.forEach(item => {
        [item.ant, ...item.counts.map(c=>c.w)].forEach(word => {
            if (!nodesMap.has(word)) nodesMap.set(word, { id: word, connections: [] });
        });
        item.counts.forEach(c => nodesMap.get(item.ant).connections.push({ target: c.w, prob: c.p }));
    });
    const nodes = Array.from(nodesMap.values());
    const N = nodes.length;

    // --- THREE.JS 基础设置 ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.002);
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 120;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.getElementById('canvas-container').appendChild(labelRenderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // --- 材质与点阵 ---
    const dotVertexShader = `
        attribute float size;
        attribute vec3 customColor;
        varying vec3 vColor;
        void main() {
            vColor = customColor;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = size * (900.0 / -mvPosition.z); // 放大三倍的基础
            gl_Position = projectionMatrix * mvPosition;
        }
    `;
    const dotFragmentShader = `
        varying vec3 vColor;
        void main() {
            vec2 cxy = 2.0 * gl_PointCoord - 1.0;
            float r = dot(cxy, cxy);
            if (r > 1.0) discard;
            float alpha = 1.0 - smoothstep(0.5, 1.0, r);
            gl_FragColor = vec4(vColor, alpha * 0.9);
        }
    `;

    const geometry = new THREE.BufferGeometry();
    const posArr = new Float32Array(N * 3), targetPos = new Float32Array(N * 3);
    const colorArr = new Float32Array(N * 3), sizeArr = new Float32Array(N);

    for (let i = 0; i < N; i++) {
        posArr[i*3] = targetPos[i*3] = (Math.random()-0.5)*100;
        posArr[i*3+1] = targetPos[i*3+1] = (Math.random()-0.5)*100;
        posArr[i*3+2] = targetPos[i*3+2] = (Math.random()-0.5)*100;
        colorArr[i*3] = colorArr[i*3+1] = colorArr[i*3+2] = 0.8;
        sizeArr[i] = 3.0; // 初始放大
        nodes[i].index = i;
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    geometry.setAttribute('customColor', new THREE.BufferAttribute(colorArr, 3));
    geometry.setAttribute('size', new THREE.BufferAttribute(sizeArr, 1));

    const points = new THREE.Points(geometry, new THREE.ShaderMaterial({
        vertexShader: dotVertexShader, fragmentShader: dotFragmentShader,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    scene.add(points);

    const linesGroup = new THREE.Group(); scene.add(linesGroup);
    const labelsGroup = new THREE.Group(); scene.add(labelsGroup);

    // 布局计算
    function applyLayout(type) {
        if(type === 'sphere') {
            const radius = 45;
            for (let i = 0; i < N; i++) {
                const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), theta = Math.PI * (3 - Math.sqrt(5)) * i;
                targetPos[i*3] = Math.cos(theta) * r * radius;
                targetPos[i*3+1] = y * radius;
                targetPos[i*3+2] = Math.sin(theta) * r * radius;
            }
        } else {
            for (let i = 0; i < N; i++) {
                targetPos[i*3] = (Math.random()-0.5)*100;
                targetPos[i*3+1] = (Math.random()-0.5)*100;
                targetPos[i*3+2] = (Math.random()-0.5)*100;
            }
        }
    }
    applyLayout('sphere');

    nodes.forEach((node, i) => {
        const div = document.createElement('div');
        div.className = 'label';
        div.textContent = node.id;
        const label = new CSS2DObject(div);
        labelsGroup.add(label);
        node.labelDiv = div; node.labelObj = label;
    });

    // --- 交互逻辑 (关键修复点) ---
    const raycaster = new THREE.Raycaster();
    raycaster.params.Points.threshold = 4.0;
    const mouse = new THREE.Vector2();
    let selectedIdx = -1;
    let currentLayoutMode = 'sphere';

    // 防止拖拽误触点击
    let mouseStart = { x: 0, y: 0 };
    window.addEventListener('mousedown', (e) => { mouseStart = { x: e.clientX, y: e.clientY }; });

    window.addEventListener('mouseup', (e) => {
        const moveDist = Math.sqrt(Math.pow(e.clientX - mouseStart.x, 2) + Math.pow(e.clientY - mouseStart.y, 2));
        if (moveDist > 5) return; // 如果移动距离大于5像素，视为旋转视图，不触发点击

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObject(points);

        if (hits.length > 0) {
            focusNode(hits[0].index);
        } else {
            selectedIdx = -1;
            resetAll();
        }
    });

    function focusNode(idx) {
        selectedIdx = idx;
        const source = nodes[idx];
        const cAttr = geometry.attributes.customColor;
        const sAttr = geometry.attributes.size;

        document.getElementById('info-panel').style.display = 'block';
        document.getElementById('selected-word').innerText = source.id;
        document.getElementById('conn-count').innerText = source.connections.length;

        // 全体变暗
        for(let i=0; i<N; i++) {
            cAttr.setXYZ(i, 0.1, 0.1, 0.1);
            sAttr.setX(i, 2.0);
            nodes[i].labelDiv.style.opacity = '0.15';
        }

        // 选中点变红，文字保持白色但放大
        cAttr.setXYZ(idx, 1.0, 0.2, 0.2);
        sAttr.setX(idx, 18.0);
        nodes[idx].labelDiv.style.opacity = '1.0';
        nodes[idx].labelDiv.style.fontSize = '18px';

        targetPos[idx*3] = 0; targetPos[idx*3+1] = 0; targetPos[idx*3+2] = 0;

        while(linesGroup.children.length > 0) linesGroup.remove(linesGroup.children[0]);
        document.querySelectorAll('.prob-tag').forEach(t => t.remove());

        source.connections.forEach((conn, i) => {
            const target = nodes.find(n => n.id === conn.target);
            if (target) {
                const tIdx = target.index;
                cAttr.setXYZ(tIdx, 0.0, 0.8, 1.0); // 蓝色
                sAttr.setX(tIdx, 8.0 + conn.prob * 35.0); // 概率缩放

                nodes[tIdx].labelDiv.style.opacity = '1.0';
                
                // 聚拢
                const angle = (i / source.connections.length) * Math.PI * 2;
                const dist = 25;
                targetPos[tIdx*3] = Math.cos(angle) * dist;
                targetPos[tIdx*3+1] = Math.sin(angle) * dist;
                targetPos[tIdx*3+2] = (Math.random()-0.5)*5;

                // 连线与标签
                const lineGeo = new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
                const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0x00bcd4, transparent: true, opacity: 0.4 }));
                line.userData = { s: idx, t: tIdx };
                linesGroup.add(line);

                const pDiv = document.createElement('div');
                pDiv.className = 'label prob-tag';
                pDiv.textContent = (conn.prob * 100).toFixed(0) + '%';
                const pLabel = new CSS2DObject(pDiv);
                line.add(pLabel); line.userData.label = pLabel;
            }
        });

        // 没关系的点飞远
        nodes.forEach(n => {
            if (n.index !== idx && !source.connections.find(c => c.target === n.id)) {
                const angle = Math.random() * Math.PI * 2;
                const r = 100 + Math.random() * 50;
                targetPos[n.index*3] = Math.cos(angle) * r;
                targetPos[n.index*3+1] = Math.sin(angle) * r;
                targetPos[n.index*3+2] = (Math.random()-0.5)*100;
            }
        });
        cAttr.needsUpdate = sAttr.needsUpdate = true;
    }

    function resetAll() {
        const cAttr = geometry.attributes.customColor;
        const sAttr = geometry.attributes.size;
        for (let i = 0; i < N; i++) {
            cAttr.setXYZ(i, 0.8, 0.8, 0.8);
            sAttr.setX(i, 3.0);
            nodes[i].labelDiv.style.opacity = '0.8';
            nodes[i].labelDiv.style.fontSize = '14px';
        }
        while(linesGroup.children.length > 0) linesGroup.remove(linesGroup.children[0]);
        document.querySelectorAll('.prob-tag').forEach(t => t.remove());
        document.getElementById('info-panel').style.display = 'none';
        applyLayout(currentLayoutMode);
        cAttr.needsUpdate = sAttr.needsUpdate = true;
    }

    // --- 动画循环 ---
    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += 0.01;
        const pAttr = geometry.attributes.position;
        const curr = pAttr.array;

        for (let i = 0; i < N; i++) {
            const ix = i * 3, iy = i * 3 + 1, iz = i * 3 + 2;
            curr[ix] += (targetPos[ix] - curr[ix]) * 0.08;
            curr[iy] += (targetPos[iy] - curr[iy]) * 0.08;
            curr[iz] += (targetPos[iz] - curr[iz]) * 0.08;
            // 缓慢晃动
            curr[ix] += Math.sin(time + i) * 0.04;
            curr[iy] += Math.cos(time + i) * 0.04;
            nodes[i].labelObj.position.set(curr[ix], curr[iy], curr[iz]);
        }

        linesGroup.children.forEach(l => {
            const s = l.userData.s, t = l.userData.t, lp = l.geometry.attributes.position.array;
            lp[0] = curr[s*3]; lp[1] = curr[s*3+1]; lp[2] = curr[s*3+2];
            lp[3] = curr[t*3]; lp[4] = curr[t*3+1]; lp[5] = curr[t*3+2];
            l.geometry.attributes.position.needsUpdate = true;
            l.userData.label.position.set((lp[0]+lp[3])/2, (lp[1]+lp[4])/2, (lp[2]+lp[5])/2);
        });

        pAttr.needsUpdate = true;
        controls.update();
        renderer.render(scene, camera);
        labelRenderer.render(scene, camera);
    }
    animate();

    // 按钮切换
    document.getElementById('btn-sphere').onclick = (e) => {
        currentLayoutMode = 'sphere'; selectedIdx = -1;
        resetAll(); setActive(e.target);
    };
    document.getElementById('btn-chaos').onclick = (e) => {
        currentLayoutMode = 'chaos'; selectedIdx = -1;
        resetAll(); setActive(e.target);
    };
    function setActive(b) {
        document.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
        b.classList.add('active');
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
